[target.thumbv6m-none-eabi]
runner = "elf2uf2-rs -d"

rustflags = [
    "-C", "link-arg=--nmagic",
    "-C", "link-arg=-Tlink.x",
]

[build]
target = "thumbv6m-none-eabi"

[profile.dev]
panic = "abort"
codegen-units = 1
debug = 2
opt-level = 3

[profile.release]
panic = "abort"
codegen-units = 1
lto = "fat"
opt-level = 3